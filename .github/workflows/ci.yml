name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly on the default branch.
    - cron: "0 0 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (tox)
    runs-on: ubuntu-latest
    # The canonical girder test image: preinstalled system deps + a girder 3.x
    # toolchain.
    container: girder/girder_test:latest
    services:
      mongo:
        image: mongo:4.0
        # RAM-backed data dir keeps the per-test drop/reconnect cheap.
        options: >-
          --tmpfs /data/db
    steps:
      - uses: actions/checkout@v4
      - name: Install tox
        run: pip install --no-cache-dir tox
      - name: Lint (ruff)
        run: tox -e lint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned VolView package (carries the backend-contract)
        # The conformance suite reads the contract from the `volview` package
        # (node_modules/volview/backend-contract), never a vendored copy. The
        # pinned package ships prebuilt artifacts, so `--ignore-scripts` is a
        # plain fast extract, and `--omit=dev` drops the JS-lint devDeps the
        # web-client job owns. Runs AFTER ruff so the linter never walks
        # node_modules.
        working-directory: girder_volview/web_client
        run: npm ci --ignore-scripts --omit=dev
      - name: Server tests
        # `-n auto` parallelizes across cores via pytest-xdist. Safe because
        # pytest-girder names each test's database uniquely, so workers sharing
        # one Mongo never collide. The service is reachable at host `mongo`.
        run: tox -e test -- -n auto --mongo-uri mongodb://mongo:27017

  web-client:
    name: Web client lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install and lint
        working-directory: girder_volview/web_client
        run: |
          npm ci
          npm run lint

  # Drives the token-only run + auto-apply UI path
  # (e2e/tests/run-and-apply.spec.ts). The paired stack it needs is defined
  # outside this repo, so the job is opt-in. The dist it serves is the same
  # pinned `volview` package `girder build` installs from
  # web_client/package.json.
  paired-browser:
    name: Paired browser gate (token-only run + auto-apply)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_PAIRED_BROWSER_GATE == 'true' }}
    steps:
      - name: Checkout girder_volview (self)
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring up paired stack
        # The stack: mongo + girder + girder_worker serving the pinned `volview`
        # dist, reachable at http://localhost:8080 (admin/password), with the
        # radiology CLI tasks registered in slicer_cli_web and the deploy receipt
        # written.
        run: |
          echo "Provision the paired live stack here (see job comment)." >&2
          exit 1
      - name: Run the browser gate
        working-directory: e2e
        run: |
          npm ci
          npm run install-browser
          npm test
