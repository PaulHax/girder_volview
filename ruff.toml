# Ruff replaces the former flake8 + flake8-bugbear + flake8-docstrings +
# flake8-quotes + pep8-naming stack (one fast tool, one config). Line length is
# Ruff's stock 88 (E501 enforced; `ruff format` does the wrapping).

# Build artifacts and vendored root-owned backups are not source.
exclude = [
    ".eggs",
    ".git",
    ".tox",
    "__pycache__",
    "node_modules",
    "build",
    ".rootowned-build.bak",
    ".rootowned-build2.bak",
]

[lint]
# E/W = pycodestyle, F = pyflakes, B = flake8-bugbear, Q = flake8-quotes,
# N = pep8-naming. Docstring rules (D, the old flake8-docstrings) are
# intentionally NOT selected: the codebase never satisfied them and they were
# ~64% of the pre-Ruff findings. Re-enable by adding "D" here plus a
# [lint.pydocstyle] convention when the team wants to invest in docstrings.
select = ["E", "W", "F", "B", "Q", "N"]
ignore = [
    # pep8-naming exemptions carried over verbatim from the old flake8 config;
    # girder's API surface is intentionally CamelCase / mixedCase.
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N812",  # lowercase imported as non-lowercase
    "N813",  # camelCase imported under a lowercase alias (intentional)
    "N815",  # mixedCase variable in class scope
    "N816",  # mixedCase variable in global scope
]

[lint.flake8-quotes]
# The codebase is intentionally double-quoted.
inline-quotes = "double"

[lint.per-file-ignores]
# Conformance tests deliberately assert against a broad Exception where the
# precise type is an implementation detail of the validator under test.
"tests/*" = ["B017"]
